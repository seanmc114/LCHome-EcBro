<!DOCTYPE html>
<html lang="en">
<head>

  <title>TURBO — Home Ec HL</title>

  <style>
    :root {

      --green: #1a7a4a; --gold: #b45309;
      --ink: #1c1917; --muted: #78716c; --border: #e0dbd4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
    .container { width: 100%; max-width: 640px; margin: 20px; background: var(--card); border-radius: 22px; padding: 28px 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.45); color: var(--ink); }
    .game-title { font-family: 'Lora', serif; font-size: 3rem; color: var(--primary); margin-bottom: 2px; font-style: italic; letter-spacing: -1px; }
    .game-sub { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
    .progress-wrap { margin-bottom: 16px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
    .progress-track { background: #eee; border-radius: 50px; height: 9px; }
    .progress-fill { height: 100%; border-radius: 50px; background: linear-gradient(90deg, var(--primary), var(--gold)); transition: width 0.4s; }
    .star-banner { background: var(--primary-light); border: 2px solid var(--primary); border-radius: 10px; padding: 9px 14px; font-size: 0.88rem; color: var(--primary); font-weight: 700; margin-bottom: 18px; }
    #cat-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; justify-content: center; }
    .cat-btn { background: #f0ece6; color: var(--muted); font-size: 0.8rem; padding: 7px 13px; border: none; border-radius: 20px; cursor: pointer; font-weight: 700; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
    .cat-btn:hover { background: #ddd; }
    .cat-btn.active { background: var(--primary); color: white; }
    #level-list { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 6px; }
    .zone-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin: 6px 0 2px; align-self: flex-start; padding-left: 4px; }
    .level-btn { font-size: 0.98rem; padding: 13px 16px; background: var(--green); color: white; border-radius: 10px; border: none; cursor: pointer; width: 96%; max-width: 380px; transition: transform 0.2s, filter 0.2s; display: flex; justify-content: space-between; align-items: center; font-family: 'Nunito', sans-serif; font-weight: 700; }
    .level-btn:hover { filter: brightness(1.08); transform: scale(1.02); }
    .level-btn:disabled { background: #c8c4bc; cursor: not-allowed; transform: none; color: #888; }
    .level-btn.adv { background: #7c3d9e; }
    .level-badge { font-size: 0.7rem; background: rgba(255,255,255,0.22); padding: 2px 8px; border-radius: 10px; }
    .Auntie-btn { background: linear-gradient(135deg, var(--primary), #922b21) !important; justify-content: center !important; font-size: 1rem !important; }
    #game { display: none; margin-top: 16px; }
    #timer { font-size: 1.3rem; color: var(--primary); font-weight: 900; margin-bottom: 14px; }
    #questions div { margin: 14px 0; font-size: 0.97rem; text-align: left; }
    #questions input { font-size: 0.97rem; padding: 9px 11px; width: 100%; margin-top: 5px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Nunito', sans-serif; box-sizing: border-box; }
    #questions input:focus { outline: none; border-color: var(--primary); }
    #submit { font-size: 1.2rem; padding: 13px 26px; background: var(--primary); color: white; border-radius: 12px; cursor: pointer; margin: 14px 4px 4px; border: none; font-family: 'Nunito', sans-serif; font-weight: 900; transition: transform 0.2s, filter 0.2s; }
    #submit:hover { filter: brightness(1.1); transform: scale(1.03); }
    #results { margin-top: 16px; font-size: 0.97rem; text-align: left; }
    .try-again, #back-button { font-size: 1rem; padding: 11px 20px; background: var(--primary); color: white; border-radius: 10px; cursor: pointer; margin: 7px 4px; border: none; font-family: 'Nunito', sans-serif; font-weight: 900; transition: transform 0.2s; }
    #back-button { background: #555; }
    .try-again:hover, #back-button:hover { transform: scale(1.03); }
    .perfect-celebration { font-size: 1.8rem; color: var(--gold); margin-bottom: 10px; text-align: center; }
    .unlock-msg { color: var(--green); font-weight: 700; font-size: 0.97rem; margin: 8px 0; }
    footer { margin-top: 28px; font-size: 0.7rem; color: #aaa; border-top: 1px solid #eee; padding-top: 12px; text-align: center; }
  </style>
</head>

</div>

// ============================================================
// GAME STATE
// ============================================================
const AUNTIE_UNLOCK = 5;
const PENALTY_SECS = 20;
const QUESTIONS_PER_ROUND = 5;

var currentCat = 'nutrition';
var currentLevel = 1;
var currentItems = [];
var startTime, timerInterval;

const levelList = document.getElementById('level-list');
const gameContainer = document.getElementById('game');
const questionsContainer = document.getElementById('questions');
const resultsContainer = document.getElementById('results');

// ============================================================
// STORAGE
// ============================================================
function storageKey(s) { return 'he_turbo_' + s; }
function getUnlocked() { return parseInt(localStorage.getItem(storageKey('unlocked')) || '1'); }
function setUnlocked(l) { if (l > getUnlocked()) localStorage.setItem(storageKey('unlocked'), l); }
function getBest(c, l) { return localStorage.getItem(storageKey('best_' + c + '_' + l)); }
function setBest(c, l, s) { var p = parseInt(getBest(c, l) || '0'); if (s > p) localStorage.setItem(storageKey('best_' + c + '_' + l), s); }

function getTotalStars() {
  var t = 0;
  ['nutrition','foodscience','consumer','resource','social'].forEach(function(c) {
    for (var v = 1; v <= 8; v++) t += parseInt(getBest(c, v) || '0');
  });
  return t;
}

function AuntieUnlocked() { return getTotalStars() >= AUNTIE_UNLOCK; }

function getTurboData() {
  var cats = ['nutrition','foodscience','consumer','resource','social'];
  var labels = { nutrition:'Nutrition', foodscience:'Food Science', consumer:'Consumer Studies', resource:'Resource Management', social:'Social Studies' };
  var data = {};
  cats.forEach(function(c) {
    data[c] = { label: labels[c], levels: {} };
    for (var l = 1; l <= 8; l++) {
      var s = getBest(c, l);
      if (s) data[c].levels[l] = parseInt(s);
    }
  });
  return data;
}

// ============================================================
// CATEGORY SELECT
// ============================================================
function selectCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderLevels();
}

// ============================================================
// RENDER LEVELS
// ============================================================
function renderLevels() {
  levelList.style.display = 'flex';
  gameContainer.style.display = 'none';
  levelList.innerHTML = '';
  updateProgress();

  var unlocked = getUnlocked();
  var zones = {
    1: { label: 'Levels 1–3 · Core Knowledge' },
    4: { label: 'Levels 4–5 · Application' },
    6: { label: 'Levels 6–8 · Exam Standard' }
  };

  for (var i = 1; i <= 8; i++) {
    if (zones[i]) {
      var zl = document.createElement('div');
      zl.className = 'zone-label';
      zl.textContent = zones[i].label;
      levelList.appendChild(zl);
    }

    var pool = getPool(currentCat, i);
    if (pool.length === 0) continue; // skip levels with no data

    var btn = document.createElement('button');
    var best = getBest(currentCat, i);
    var locked = i > unlocked;
    var stars = best ? '⭐'.repeat(parseInt(best)) + '☆'.repeat(3 - parseInt(best)) : '';
    var isAdv = i >= 6;

    btn.className = 'level-btn' + (isAdv ? ' adv' : '');
    btn.type = 'button';
    btn.innerHTML = '<span>' + (locked ? '🔒 ' : '') + 'Level ' + i + ' <span style="font-size:0.72rem;opacity:0.6">(' + pool.length + ' items)</span></span>' +
      '<span class="level-badge">' + (stars || (locked ? '' : '—')) + '</span>';
    btn.disabled = locked;

    (function(lv) {
      btn.addEventListener('click', function() { startGame(lv); });
    })(i);

    levelList.appendChild(btn);
  }

  if (AuntieUnlocked()) {
    var eb = document.createElement('button');
    eb.type = 'button';
    eb.textContent = '📋 Meet The Auntie →';
    eb.className = 'level-btn Auntie-btn';
    eb.addEventListener('click', function() {
      localStorage.setItem('he_turbo_data', JSON.stringify(getTurboData()));
      window.location.href = 'he-Auntie.html';
    });
    levelList.appendChild(eb);
  }
}

// ============================================================
// GET ITEM POOL FOR LEVEL (level + adjacent)
// ============================================================
function getPool(cat, level) {
  return (TERMS[cat] || []).filter(function(p) { return p.lv === level; });
}

function getPlayPool(cat, level) {
  var exact = (TERMS[cat] || []).filter(function(p) { return p.lv === level; });
  var adjacent = (TERMS[cat] || []).filter(function(p) { return Math.abs(p.lv - level) === 1; });
  return shuffleArray(exact.slice()).concat(shuffleArray(adjacent.slice()));
}

// ============================================================
// START GAME
// ============================================================
function startGame(level) {
  currentLevel = level;
  var pool = getPlayPool(currentCat, level);
  currentItems = shuffleArray(pool.slice()).slice(0, QUESTIONS_PER_ROUND);

  levelList.style.display = 'none';
  gameContainer.style.display = 'block';
  questionsContainer.innerHTML = '';
  resultsContainer.innerHTML = '';

  currentItems.forEach(function(item) {
    var div = document.createElement('div');
    div.innerHTML =
      '<div><strong>' + escHtml(item.prompt) + '</strong></div>' +
      '<input type="text" data-answer="' + escHtml(item.answer) + '" ' +
      'placeholder="Type your answer..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    var inp = div.querySelector('input');
    inp.addEventListener('paste', function(e) { e.preventDefault(); });
    inp.addEventListener('drop', function(e) { e.preventDefault(); });
    questionsContainer.appendChild(div);
  });

  startTimer();

  // Focus first input
  var first = questionsContainer.querySelector('input');
  if (first) first.focus();
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(function() {
    document.getElementById('timer').textContent = 'Time: ' + Math.floor((Date.now() - startTime) / 1000) + 's';
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

// ============================================================
// SUBMIT
// ============================================================
document.getElementById('submit').addEventListener('click', function() {
  stopTimer();
  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  var penalty = 0;
  var total = currentItems.length;
  var strictCorrect = 0;
  var lenientCorrect = 0;

  // Collect results first
  var results = [];
  document.querySelectorAll('#questions input').forEach(function(input) {
    var userAns = input.value.trim();
    var correctAns = input.dataset.answer;
    var strict = normaliseStrict(userAns) === normaliseStrict(correctAns);
    var lenient = normaliseLenient(userAns) === normaliseLenient(correctAns);
    results.push({
      userAns: userAns,
      correctAns: correctAns,
      strict: strict,
      lenient: lenient,
      prompt: input.closest('div').querySelector('strong').textContent
    });
    if (lenient) lenientCorrect++;
    if (strict) strictCorrect++;
  });

  // Colour borders
  document.querySelectorAll('#questions input').forEach(function(input, idx) {
    if (results[idx].lenient) {
      input.style.border = '2px solid #27ae60';
      input.style.background = '#f0fff4';
    } else {
      penalty += PENALTY_SECS;
      input.style.border = '2px solid #e74c3c';
      input.style.background = '#fff5f5';
    }
  });

  var totalTime = elapsed + penalty;
  var stars = 0;
  if (strictCorrect === total && totalTime <= levelTimeLimit(currentLevel)) stars = 3;
  else if (lenientCorrect === total) stars = 2;
  else if (lenientCorrect >= Math.ceil(total * 0.5)) stars = 1;

  setBest(currentCat, currentLevel, stars);
  if (stars >= 1) setUnlocked(currentLevel + 1);

  // Render results
  resultsContainer.innerHTML = '';

  if (lenientCorrect === total) {
    var cel = document.createElement('div');
    cel.className = 'perfect-celebration';
    cel.textContent = stars === 3 ? '🎉 PERFECT — 3 stars!' : '✅ All correct!';
    resultsContainer.appendChild(cel);
  }

  var sum = document.createElement('div');
  sum.innerHTML = '<h3>Done!</h3><p>Correct: ' + lenientCorrect + '/' + total + '</p>' +
    '<p>Time: ' + elapsed + 's + Penalty: ' + penalty + 's = <strong>' + totalTime + 's</strong></p>' +
    '<p style="font-size:1.4rem">' + '⭐'.repeat(stars) + '☆'.repeat(3 - stars) + '</p>';
  resultsContainer.appendChild(sum);

  // Show missed answers
  var missed = results.filter(function(r) { return !r.lenient; });
  if (missed.length) {
    var mt = document.createElement('h4');
    mt.textContent = 'What you missed:';
    mt.style.marginTop = '10px';
    resultsContainer.appendChild(mt);
    missed.forEach(function(r) {
      var p = document.createElement('p');
      p.style.cssText = 'margin:6px 0;font-size:0.9rem;';
      p.innerHTML = '<strong>' + escHtml(r.prompt) + '</strong><br>' +
        '✅ <span style="color:#27ae60">' + escHtml(r.correctAns) + '</span><br>' +
        '❌ <span style="color:#e74c3c">' + escHtml(r.userAns || '(blank)') + '</span>';
      resultsContainer.appendChild(p);
    });
  }

  if (stars >= 1) {
    var um = document.createElement('p');
    um.className = 'unlock-msg';
    um.textContent = '🔓 Level ' + (currentLevel + 1) + ' unlocked!';
    resultsContainer.appendChild(um);
  }

  updateProgress();

  if (AuntieUnlocked()) {
    var bm = document.createElement('p');
    bm.className = 'unlock-msg';
    bm.innerHTML = '📋 The Auntie is ready! <a href="he-Auntie.html" style="color:#1a7a4a;font-weight:bold;" onclick="saveTurboData()">Meet The Auntie →</a>';
    resultsContainer.appendChild(bm);
  }

  var tb = document.createElement('button');
  tb.textContent = 'Try Again';
  tb.className = 'try-again';
  tb.type = 'button';
  tb.onclick = function() { startGame(currentLevel); };
  resultsContainer.appendChild(tb);

  var bb = document.createElement('button');
  bb.textContent = '← Back to Levels';
  bb.id = 'back-button';
  bb.type = 'button';
  bb.onclick = function() { renderLevels(); };
  resultsContainer.appendChild(bb);
});

function saveTurboData() {
  localStorage.setItem('he_turbo_data', JSON.stringify(getTurboData()));
}

function levelTimeLimit(l) { return 140 - (l - 1) * 10; }

// ============================================================
// PROGRESS
// ============================================================
function updateProgress() {
  var stars = getTotalStars();
  var pct = Math.min(100, Math.round((stars / AUNTIE_UNLOCK) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent = pct + '%';
  var banner = document.getElementById('star-banner');
  if (AuntieUnlocked()) {
    banner.textContent = '🎉 ' + stars + ' stars — The Auntie is unlocked!';
    banner.style.background = '#eafaf1';
    banner.style.borderColor = '#1a7a4a';
    banner.style.color = '#1a7a4a';
  } else {
    banner.textContent = '⭐ ' + stars + ' star' + (stars !== 1 ? 's' : '') + ' earned — need ' + AUNTIE_UNLOCK + ' to unlock The Auntie';
  }
}

// ============================================================
// NORMALISERS — generous for Home Ec answers
// ============================================================
function normaliseLenient(s) {
  return String(s).toLowerCase()
    .replace(/['']/g, '')
    .replace(/[,;:.]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function normaliseStrict(s) {
  return String(s).toLowerCase()
    .replace(/['']/g, '')
    .replace(/[,;:.]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function shuffleArray(a) { return a.sort(function() { return Math.random() - 0.5; }); }

function escHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

// ============================================================
// INIT
// ============================================================
(function() {
  renderLevels();
})();
</script>
